name: SAPUL CREATION v1.1.4 - Android APK Build

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: sapul-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Project Files
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f gradlew
          test -f backend/package.json
          test -f .github/workflows/android-build.yml

      - name: Set Gradle Permissions
        run: chmod +x ./gradlew

      - name: Verify Android Version
        run: |
          grep -q 'versionName = "1.1.4"' app/build.gradle.kts
          echo "Android version 1.1.4 confirmed."

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Backend Syntax and Contract Checks
        working-directory: backend
        run: npm run check

      - name: Backend Tests
        working-directory: backend
        run: npm run test:contracts

      - name: Android Unit Tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK Exists
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/

      - name: Upload SAPUL CREATION APK
        uses: actions/upload-artifact@v4
        with:
          name: sapul-creation-v1.1.4-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
